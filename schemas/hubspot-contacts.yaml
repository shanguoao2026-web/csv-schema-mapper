    type: string
    synonyms: [zip code, postal code, postal, postcode, post code]
  - id: country
    header: country
    label: Country/Region
    type: string
    synonyms: [country name, nation]
  - id: lifecyclestage
    header: lifecyclestage
    label: Lifecycle Stage
    type: enum
    enum: [subscriber, lead, marketingqualifiedlead, salesqualifiedlead, opportunity, customer, evangelist, other]
    synonyms: [lifecycle stage, lifecycle, life cycle]
  - id: hs_lead_status
    header: hs_lead_status
    label: Lead Status
